name: deploy-dev

on:
  push:
    branches: [dev]

permissions:
  id-token: write # OIDC role assumption
  contents: read
  security-events: write # ci.yml gate (gitleaks/trivy SARIF)
  pull-requests: read

jobs:
  # Re-run CI as the gate (warn-only security on dev; quality still blocks).
  gate:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    concurrency: deploy-dev
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3 # arm64 emulation for the Lambda image build
        with:
          platforms: arm64
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"
      - run: uv sync --extra dev
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g aws-cdk
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy dev stacks
        run: cd infrastructure && cdk deploy LookoutDev LookoutDevMonitoring --require-approval never
